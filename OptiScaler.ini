; -------------------------------------------------------
[Upscalers]
; -------------------------------------------------------
; 为 Dx11 游戏选择超分器
; fsr22（原生 DX11）、fsr31（原生 DX11）、xess（原生 DX11，仅 Arc）、xess_12（dx11on12）、fsr21_12（dx11on12）、fsr22_12（dx11on12）、ffx_12（FSR 2.3; 3.1; 4.x）、dlss - 默认（auto）为 fsr22
Dx11Upscaler=auto

; 为 Dx12 游戏选择超分器
; xess, fsr21, fsr22, ffx (FSR 2.3; 3.1; 4.x), dlss
; 默认（auto）为 DLSS when capable gpu, FSR4 when capable gpu, XeSS otherwise
Dx12Upscaler=auto

; 为 Vulkan 游戏选择超分器
; fsr21（原生 VK）、fsr22（原生 VK）、ffx（原生 FSR 2.3; 3.1）、xess（原生 VK）、fsr21_12（VKon12）、ffx_12（FSR 2.3; 3.1; 4.x）、dlss - 默认（auto）为 fsr22
VulkanUpscaler=auto



; -------------------------------------------------------
[FrameGen]
; -------------------------------------------------------
; 启用帧生成
; true 或 false - 默认（auto）为 false
Enabled=auto

; 选定的 FG 输入/来源
; dlssg    - 可与任意 FG 输出同用。开箱即支持无 HUD 图像。仅适用于使用 Streamline 和 DLSSG 的游戏
; nvngxfg  - 仅限 FSR 3 FG（配合 DLSS Enabler 的 dll 实现 MFG）。需要游戏内启用 DLSSG。开箱即支持无 HUD 图像。使用 Streamline 交换链进行帧节奏控制。
; fsrfg    - 可与任意 FG 输出同用。开箱即支持无 HUD 图像。
; upscaler - 必须启用超分。可与任意 FG 输出同用，但在部分情况下可能不够完美。为防止 UI 故障，需要启用 Hudfix
; fsrfg30  - 可与任意 FG 输出同用。开箱即支持无 HUD 图像。
; nofg、dlssg、nvngxfg、fsrfg、upscaler、fsrfg30 - 默认（auto）为 nofg
FGInput=auto

; 选定的 FG 输出
; fsrfg          - 需要 amd_fidelityfx_dx12.dll 或 amd_fidelityfx_loader_dx12.dll + amd_fidelityfx_framegeneration_dx12.dll
; xefg           - 需要 libxess_fg.dll 和 libxell.dll
; dlssg          - 需要 'OptiScaler/streamline' 文件夹内的 streamline dll 以及 nvngx_dlssg.dll
; nofg、fsrfg、xefg、dlssg - 默认（auto）为 nofg
FGOutput=auto

; 选定的 FG Nvngx 替换
; Nvngx FG 是更底层的 DLSSG 提供方。需要设置 FGInput=NvngxFG 或 FGOutput=DLSSG，此项才会生效
; 例如，要在仅有超分的游戏中使用 Nukems：FGInput=upscaler, FGOutput=dlssg, FGNvngxReplacement=Nukems
; 要在已支持 DLSSG 的游戏中使用 Arturs：FGInput=nvngxfg, FGOutput=auto, FGNvngxReplacement=Arturs
; None      - 不做替换
; Nukems    - 需要 dlssg_to_fsr3_amd_is_better.dll，FSR 3 FG
; Arturs    - 需要 dlss-enabler-headless.dll，FSR 3 MFG
; FFX       - 需要 amd_fidelityfx_dx12.dll 或 amd_fidelityfx_loader_dx12.dll + amd_fidelityfx_framegeneration_dx12.dll，FSRFG 3 或 4
; Combo     - 需要同时满足 FFX 和 Arturs 的要求，中间帧使用 FFX，其余帧使用 Enabler。允许在 4x 和 6x 模式下组合使用 FSR 4 FG 和 Enabler
; None、Nukems、Arturs、FFX、Combo - 默认（auto）为 None
FGNvngxReplacement=auto

; 帧时间来源，会影响帧节奏
; 0: 输入（DLSSG/FSRFG/OptiFG）| 1: Present 调用之间的时间 | 2: 零（仅适用于 XeFG）
; true 或 false - 默认（auto）为 0
FTInput=auto

; 启用帧生成调试视图
; true 或 false - 默认（auto）为 false
DebugView=auto

; 在 FG 之上绘制 UI，需要无 HUD 图像和 UI 纹理，主要用于 FSR FG
; true 或 false - 默认（auto）为 false
DrawUIOverFG=auto

; 设置所提供的 UI 纹理类型；与 DrawUIOverFG + FSR FG 同用时会改变 UI 的显示效果
; true 或 false - 默认（auto）为 true
UIPremultipliedAlpha=auto

; 即使 FG 输入源已提供无 HUD 图像，仍由本插件控制
; true 或 false - 默认（auto）为 false
DisableHudless=auto

; 即使 FG 输入源已提供 UI 纹理，仍由本插件控制
; true 或 false - 默认（auto）为 true
DisableUI=auto

; 忽略来自 FG 输入的 Reset 信号
; true 或 false - 默认（auto）为 false
SkipReset=auto

; 定义 FG 矩形区域
; 整数值 - 默认（auto）为整屏
RectLeft=auto
RectTop=auto
RectWidth=auto
RectHeight=auto

; 允许 FG 领先游戏渲染的帧数
; 可能阻止 FG 的开/关切换，但也可能引发问题
; 1 至 3 - 默认（auto）为 1
AllowedFrameAhead=auto

; 始终将深度标记为 ValidNow
; 会占用更多显存，但 Uniscaler 需要
; true 或 false - 默认（auto）为 false
DepthValidNow=auto

; 始终将速度矢量标记为 ValidNow
; 会占用更多显存，但 Uniscaler 需要
; true 或 false - 默认（auto）为 false
VelocityValidNow=auto

; 始终将无 HUD 图像标记为 ValidNow
; 会占用更多显存，但 Uniscaler 需要
; true 或 false - 默认（auto）为 false
HudlessValidNow=auto

; 如果输入源标记了多个无 HUD 图像，仅使用第一个
; true 或 false - 默认（auto）为 false
OnlyAcceptFirstHudless=auto

; 保留并阻止释放 FG 交换链
; 可能防止释放交换链时崩溃
; true 或 false - 默认（auto）为 true
PreserveSwapChain=auto

; 跳过对交换链的 ResizeBuffers 调用
; 如果新旧描述相同
; 防止 ResizeBuffers 调用后崩溃
; true 或 false - 默认（auto）为 true
SkipResizeBuffers=auto

; 通常在 ResizeBuffers 调用后交换交换链缓冲区
; 启用此选项时应处于 COMMON 状态
; OptiScaler 将尝试设置交换链缓冲区状态
; 在跳过 ResizeBuffers 调用时
; 可能导致崩溃，也可能修复崩溃
; true 或 false - 默认（auto）为 false
ModifyBufferState=auto

; 通常在 ResizeBuffers 调用后设置交换链当前索引
; 启用此选项时应为 0
; OptiScaler 将尝试通过调用 Present 来设置交换链索引
; 直到索引达到 0
; 可能导致崩溃，也可能修复崩溃
; true 或 false - 默认（auto）为 false
ModifySCIndex=auto

; 截断 UI 的透明度以辅助插帧
; 仅适用于 FSR FG 输出和 NvngxFG
; 0.0 - 1.0 - 默认（auto）为 0.0, unless it's know to fix a game
HudCutoff=auto



; -------------------------------------------------------
[FSRFG]
; -------------------------------------------------------
; 启用 FSR3.1 帧生成撕裂线显示
; true 或 false - 默认（auto）为 false
DebugTearLines=auto

; 启用 FSR3.1 帧生成插帧跳过线显示
; true 或 false - 默认（auto）为 false
DebugResetLines=auto

; 启用 FSR3.1 帧生成节奏线显示
; true 或 false - 默认（auto）为 false
DebugPacingLines=auto

; 启用异步 FSR3.1 帧生成
; true 或 false - 默认（auto）为 false
AllowAsync=auto

; 为 FG 交换链的 Present 调用启用互斥锁
; 禁用后可能提升性能，但会牺牲稳定性
; true 或 false - 默认（auto）为 true
UseMutexForSwapchain=auto

; 帧节奏调优
; -------------------------------------------------------
; 启用自定义帧节奏调优参数
; true 或 false - 默认（auto）为 true
FramePacingTuning=auto

; 此信息来源于：
; https://github.com/GPUOpen-LibrariesAndSDKs/FidelityFX-SDK/blob/54fbaafdc34716811751bea5032700e78f5a0f33/ffx-api/include/ffx_api/ffx_api_types.h#L197
;
; 默认调优
; safetyMarginInMs==0.1ms and varianceFactor==0.1.
; 
; 调优集 A
; safetyMarginInMs==0.75ms, and varianceFactor==0.1.
;
; 调优集 B
; safetyMarginInMs==0.01ms and varianceFactor==0.3.
;
; 如果游戏在使用 FG 时，从复杂场景逐渐过渡到简单场景后帧率异常偏低，
; 你可以尝试设置 "Tuning Set B" 来挽回损失的帧数，代价是方差略微升高。
;
; OptiScaler 将默认使用 Tuning B

; 帧节奏调优
; 设置安全余量
; float - 默认（auto）为 0.01
FPTSafetyMarginInMs=auto

; 帧节奏调优
; 设置方差因子
; 0.0 - 1.0 - 默认（auto）为 0.3
FPTVarianceFactor=auto

; 帧节奏调优
; 允许帧同步自旋锁进入休眠，可降低 CPU 占用
; 可能导致 FPS 上升缓慢
; true 或 false - 默认（auto）为 false
FPTHybridSpin=auto

; 帧节奏调优
; 当 FPTHybridSpin 为 true 时的自旋时长。以计时器分辨率单位计。
; 不建议低于 2，否则会频繁出现过冲
; uint - 默认（auto）为 2
FPTHybridSpinTime=auto

; 帧节奏调优
; 使用 WaitForSingleObject 等待栅栏值，而非自旋等待
; true 或 false - 默认（auto）为 false
FPTWaitForSingleObjectOnFence=auto

; 启用 FSR-FG Redstone 水印
; true 或 false - 默认（auto）为 false
EnableWatermark=auto



; -------------------------------------------------------
[XeFG]
; -------------------------------------------------------
; 跳过 XeFG 的 ini 预检查
; 可能导致画质下降或崩溃！
; true 或 false - 默认（auto）为 false
IgnoreInitChecks=auto

; 设置插值帧数量（MFG）
; 1 = 2X | 2 = 3X | 3 = 4X
; true 或 false - 默认（auto）为 1
InterpolationCount=auto

; XeFG DepthInverted 标志
; true 或 false - 默认（auto）为 true
DepthInverted=auto

; 禁用 UI 插帧
; 仅在提供无 HUD 图像时有效
; true 或 false - 默认（auto）为 false
UIComposition=auto

; XeFG JitteredMV 标志
; true 或 false - 默认（auto）为 false
JitteredMV=auto

; XeFG HighResMV 标志
; true 或 false - 默认（auto）为 false
HighResMV=auto

; 启用 XeFG 调试方块
; true 或 false - 默认（auto）为 false
DebugView=auto

; 强制使用无边框模式而非独占全屏
; 在模式切换时可能导致稳定性问题
; 或独占全屏模式下的画质问题时
; 小于显示分辨率
; true 或 false - 默认（auto）为 false
ForceBorderless=auto



; -------------------------------------------------------
[DLSSG]
; -------------------------------------------------------
; 设置插值帧数量（MFG）
; 1 = 2X | 2 = 3X | 3 = 4X | 4 = 5X | 5 = 6X
; true 或 false - 默认（auto）为 1
InterpolationCount=auto

; 默认（auto）为 true
UseGamesReflexMarkers=auto

; 用于覆盖发送给 SL 的游戏内取值：可以是 Nvngx FG；当使用真实 DLSSG 时也可以是 noFG
; 默认（auto）为 no override
OverrideInterpolationCount=auto

; 尝试在游戏原生 DLSSG 中强制启用动态 MFG。需要 Nvidia Blackwell 或任意 AMD/Intel 显卡（Nvngx FG）
; 需要 Streamline 2.11
; 默认（auto）为 false
OverrideForceDMFG=auto

; 在 Opti 自身的 DLSSG 输出中强制启用动态 MFG。需要 Nvidia Blackwell 或任意 AMD/Intel 显卡（Nvngx FG）
; 需要 Streamline 2.11
; 默认（auto）为 false
ForceDMFG=auto


; 设置动态多帧生成的 FPS 目标
; 非零时，将无法手动调整 FG 倍率
; 需要启用 DMFG
; 默认（auto）为 0.0 (monitor's refresh rate)
FramerateTargetDMFG=auto



; -------------------------------------------------------
[OptiFG]
; -------------------------------------------------------

; 禁用 HUDFix 资源跟踪
; 同时在与以下项同用时降低 CPU 开销：
; 处理 HUD 元素的机器学习帧生成器
; true 或 false - 默认（auto）为 false
DisableHUDFix=auto

; 为帧生成启用 HUDFix 无 HUD 跟踪
; 可能导致崩溃，尤其是与异步模式同用时
; true 或 false - 默认（auto）为 false
HUDFix=auto

; 延迟无 HUD 图像捕获
; 可能导致崩溃，尤其是设置过高时！
; 大于 0 的整数值 - 默认（auto）为 1
HUDLimit=auto

; 针对更多图像格式的扩展无 HUD 检查
; 可能导致崩溃和卡顿。
; true 或 false - 默认（auto）为 false
HUDFixExtended=auto

; 资源跟踪时不使用 CreateRenderTargetView
; true 或 false - 默认（auto）为 false
HudfixDisableRTV=auto

; 资源跟踪时不使用 CreateShaderResourceView
; true 或 false - 默认（auto）为 false
HudfixDisableSRV=auto

; 资源跟踪时不使用 CreateUnorderedAccessView
; true 或 false - 默认（auto）为 false
HudfixDisableUAV=auto

; 资源跟踪时不使用 OMSetRenderTargets
; true 或 false - 默认（auto）为 false
HudfixDisableOM=auto

; 资源跟踪时不使用 SetComputeRootDescriptorTable
; true 或 false - 默认（auto）为 true
HudfixDisableSCR=auto

; 资源跟踪时不使用 SetGraphicsRootDescriptorTable
; true 或 false - 默认（auto）为 true
HudfixDisableSGR=auto

; 资源跟踪时不使用 DrawInstanced
; true 或 false - 默认（auto）为 false
HudfixDisableDI=auto

; 资源跟踪时不使用 DrawIndexedInstanced
; true 或 false - 默认（auto）为 false
HudfixDisableDII=auto

; 资源跟踪时不使用 Dispatch
; true 或 false - 默认（auto）为 false
HudfixDisableDispatch=auto

; 阻止交换链缓冲区被用作无 HUD 图像
; 可能有助于修复叠加层问题，但也可能降低兼容性
; true 或 false - 默认（auto）为 false
HUDFixDontUseSwapchainBuffers=auto

; 将无 HUD 图像的分辨率检查放宽 32 像素
; 有助于解决部分分辨率和屏幕比例下使用黑边的游戏（如《巫师 3》）
; true 或 false - 默认（auto）为 false
HUDFixRelaxedResolutionCheck=auto

; 启用着色器执行前的资源捕获。
; 提高无 HUD 图像的捕获几率，但可能捕获不必要的资源。
; true 或 false - 默认（auto）为 false
HUDFixImmediate=auto

; 无论 Hudfix 设置如何，资源跟踪始终启用
; 可能导致性能问题，但禁用又可能引发稳定性问题
; true 或 false - 默认（auto）为 false
AlwaysTrackHeaps=auto

; 使用分片而非单一互斥锁来跟踪资源
; 可能提升重度多线程游戏的性能
; true 或 false - 默认（auto）为 false
UseShards=auto

; 阻止极少使用的资源被用作无 HUD 图像
; 以防止闪烁及其他问题
; true 或 false - 默认（auto）为 false
ResourceBlocking=auto

; 复制一份深度图，供 Hudfix FG 调用使用
; 设为 false 很可能偶尔导致画面错乱
; true 或 false - 默认（auto）为 true
MakeDepthCopy=auto

; 根据 DepthScaleMax 值缩放深度缓冲
; 修复 DLSS-D + UE 下损坏的深度缓冲信息
; true 或 false - 默认（auto）为 false
EnableDepthScale=auto

; EnableDepthScale 的缩放值
; 深度值将除以此值
; float - 默认（auto）为 10000.0
DepthScaleMax=auto

; 复制一份运动矢量，供 Hudfix FG 调用使用
; 设为 false 很可能偶尔导致画面错乱
; true 或 false - 默认（auto）为 true
MakeMVCopy=auto

; 翻转深度与速度矢量纹理
; 这应能修复 OptiFG 在 Unity 游戏中的问题
; true 或 false - 默认（auto）为 false
ResourceFlip=auto

; 根据插帧区域翻转深度与速度矢量纹理
; 这应能修复 OptiFG 在 Unity 游戏中的问题
; true 或 false - 默认（auto）为 false
ResourceFlipOffset=auto

; 始终捕获 FSR-FG 3.1 交换链并与选定的输出进行交换
; 这应能修复以下情况的双重 Present 调用问题：
; 游戏创建了 FSR-FG 交换链但并未使用（《寂静岭 f》）
; true 或 false - 默认（auto）为 false
AlwaysCaptureFSRFGSwapchain=auto



; -------------------------------------------------------
[Inputs]
; -------------------------------------------------------
; OptiScaler 将挂钩 (nvngx.dll) 并使用 Dlss 输入
; true 或 false - 默认（auto）为 true
EnableDlssInputs=auto

; OptiScaler 将挂钩 (libxess.dll) 并使用 XeSS 输入
; true 或 false - 默认（auto）为 true
EnableXeSSInputs=auto

; OptiScaler 将挂钩 Fsr2 输入
; true 或 false - 默认（auto）为 true
EnableFsr2Inputs=auto

; OptiScaler 将挂钩 Fsr2 Dx11 输入而非 Dx12 输入
; true 或 false - 默认（auto）为 false
UseFsr2Dx11Inputs=auto

; OptiScaler 将挂钩 Fsr2 Vulkan 输入而非 Dx11 和 Dx12 输入
; true 或 false - 默认（auto）为 false
UseFsr2VulkanInputs=auto

; OptiScaler 将使用 Fsr2 输入
; true 或 false - 默认（auto）为 true
UseFsr2Inputs=auto

; 尝试通过模式匹配查找 FSR2 方法
; 会拖慢游戏加载速度
; true 或 false - 默认（auto）为 false
Fsr2Pattern=auto

; OptiScaler 将挂钩 Fsr3 输入
; true 或 false - 默认（auto）为 true
EnableFsr3Inputs=auto

; OptiScaler 将使用 Fsr3 输入
; true 或 false - 默认（auto）为 true
UseFsr3Inputs=auto

; 尝试通过模式匹配查找 FSR3 方法
; 会拖慢游戏加载速度
; true 或 false - 默认（auto）为 false
Fsr3Pattern=auto

; OptiScaler 将挂钩 FidelityFX (amd_fidelityfx_dx12.dll) API 输入
; true 或 false - 默认（auto）为 true
EnableFfxInputs=auto

; OptiScaler 将使用 FidelityFX API 输入
; true 或 false - 默认（auto）为 true
UseFfxInputs=auto

; 启用游戏内 FSR3.1 超分器与 OptiScaler 所选超分器之间的热切换
; true 或 false - 默认（auto）为 false
EnableHotSwapping=auto



; -------------------------------------------------------
[FSRFGInputs]
; -------------------------------------------------------
; 不使用在 ffxConfig 中设置的无 HUD 图像
; true 或 false - 默认（auto）为 false
SkipConfigForHudless=auto

; 不使用在 ffxDispatch 中设置的无 HUD 图像
; true 或 false - 默认（auto）为 false
SkipDispatchForHudless=auto



; -------------------------------------------------------
[Framerate]
; -------------------------------------------------------
; 尽可能使用 Reflex 的帧率限制
; 包含任何可替代 Reflex 的技术，如 XeLL 或 AntiLag 2
; float - 默认（auto）为 0.0（禁用）
FramerateLimit=auto



; -------------------------------------------------------
[XeSS]
; -------------------------------------------------------
; 在初始化前为 XeSS 构建管线
; true 或 false - 默认（auto）为 true
BuildPipelines=auto 

; 在初始化前为 XeSS 创建堆对象
; true 或 false - 默认（auto）为 true
CreateHeaps=auto 

; 选择 XeSS 网络模型
; 目前似乎没有实际作用
; 0 = KPSS | 1 = Splat | 2 = 模型 3 | 3 = 模型 4 | 4 = 模型 5 | 5 = 模型 6
; 默认（auto）为 0
NetworkModel=auto



; -------------------------------------------------------
[FSR]
; -------------------------------------------------------
; 为 FSR 和 FSR FG 设置相机垂直 FOV 值
; 0.0 至 180.0 - 默认（auto）为 60.0
VerticalFov=auto

; 若未定义垂直 FOV，将用其计算垂直 FOV
; 0.0 至 180.0 - 默认（auto）为 off
HorizontalFov=auto

; 为 FSR 和 FSR FG 设置相机近平面值
; 0.0 至 max float value - 默认（auto）为 0.1
CameraNear=auto

; 为 FSR 和 FSR FG 设置相机远平面值
; 0.0 至 max float value - 默认（auto）为 10000.0
CameraFar=auto

; 启用相机参数的使用（近平面、远平面、FOV）
; 从 FSR2/3 或 FFX 输入接收的
; true 或 false - 默认（auto）为 true
UseFsrInputValues=auto

; 为 FSR3.X 超分器启用调试视图
; true 或 false - 默认（auto）为 false
DebugView=auto

; 为 FSR3.X/4 选择超分后端
; 0 = FSR 4.0.2 | 1 = FSR 3.1.5 | 2 = FSR 2.3.4 
; 取决于 GPU - 默认（auto）为 0 - RDNA4 使用 FSR4，其余使用 FSR3
UpscalerIndex=auto

; 为 FFX 选择 FG 后端
; 0 = FSR 4.0.0 | 1 = FSR 3.1.6
; 取决于 GPU - 默认（auto）为 0 - RDNA4 使用 FSR4，其余使用 FSR3
FGIndex=auto

; 为 FSR3.1.1 及以上版本设置速度因子
; 取值为 0.0f 可提升亮色像素的时域稳定性。
; 0.0 至 1.0 - 默认（auto）为 1.0
VelocityFactor=auto

; 为 FSR3.1.4 及以上版本设置响应性缩放
; 用于开发测试：验证向反应遮罩写入更大的值是否能减少残影
; 0.0 至 infinite - 默认（auto）为 1.0
ReactiveScale=auto

; 为 FSR3.1.4 及以上版本设置着色缩放
; 提高该值会在读取时放大 fsr3.1 计算出的着色变化值，以获得更高的响应性。
; 0.0 至 infinite - 默认（auto）为 1.0
ShadingScale=auto

; 为 FSR3.1.4 及以上版本设置每帧增加的累积量
; 对应在发生去遮挡的像素坐标处、或反应遮罩值 > 0.0f 时，每帧增加的累积量。
; 降低该值，并将产生残影的物体（即无运动矢量）以接近 1.0f 的值绘制到反应遮罩，可减少时域残影。
; 降低该值可能导致更多细薄特征的像素闪烁。
; 0.0 至 1.0 - 默认（auto）为 0.333
AccAddPerFrame=auto

; 为 FSR3.1.4 及以上版本设置最小去遮挡累积量
; 提高该值可减少摇摆细薄物体相互频繁去遮挡时周围白色像素的时域闪烁。
; 数值过高可能加重残影。足够负的值表示：对于第 N 帧中发生去遮挡的像素坐标，
; 从第 N+2 帧开始增加 fAccumulationAddedPerFrame。
; -1.0 至 1.0 - 默认（auto）为 -0.333
MinDisOccAcc=auto

; 将原始 DLSS 反应遮罩用作透明度遮罩
; true 或 false - 默认（auto）为 true
UseReactiveMaskForTransparency=auto

; 与 FSR 搭配使用时施加 DLSS 反应遮罩的偏置
; 数值越高，对新帧的偏置越大
; 0.0 - 0.9 - 默认（auto）为 0.45
DlssReactiveMaskBias=auto

; 强制 Opti 尝试使用指定的 FSR 4 模型
; 在并不支持的 GPU 上强行启用 FP8 时不要自欺欺人，驱动会回退到 FSR 3
; 0 = 不覆盖 | 1 = FP8 | 2 = INT8
; 0 至 2 - 默认（auto）为 0
Fsr4ForceModel=auto

; 选择要使用的 FSR4 内置预设
; 0 = FSR 原生 AA，1 = 超级质量/质量，2 = 均衡，3 = 性能，4 = DRS，5 = 超级性能
; 0 至 5 - 默认（auto）为游戏默认值
Fsr4Preset=auto

; 启用 FSR4 水印
; true 或 false - 默认（auto）为 false
Fsr4EnableWatermark=auto

; 阻止 OptiScaler 加载 amdxc64.dll
; true 或 false - 默认（auto）为 false
Fsr4DoNotLoadAmdxc64=auto

; 表示输入颜色资源使用非线性色彩空间
; 可能改善 FSR4 的画质
; true 或 false - 默认（auto）为 false
FsrNonLinearColorSpace=auto

; 表示输入颜色资源包含感知 sRGB 色彩
; 可能改善 FSR4 的画质
; true 或 false - 默认（auto）为 false
FsrNonLinearSRGB=auto

; 表示输入颜色资源包含感知 PQ 色彩
; 可能改善 FSR4 的画质
; true 或 false - 默认（auto）为 false
FsrNonLinearPQ=auto

; 更新 DirectX 12 Agility SDK
; 允许在 Windows 10 上的老游戏（如《赛博朋克 2077》）中使用 FSR4
; 必须将 D3D12_OptiScaler 文件夹复制到 OptiScaler 文件夹中！
; true 或 false - 默认（auto）为 false
FsrAgilitySDKUpgrade=auto



; -------------------------------------------------------
[DLSS]
; -------------------------------------------------------
; 启用对原始 NVNGX 的调用
; true 或 false - 默认（auto）为 true
Enabled=auto

; 设为 true 以启用自定义渲染预设覆盖
; true 或 false - 默认（auto）为 false
RenderPresetOverride=auto

; 画质设置的渲染预设
; 取决于 DLSS 版本，但最新的顺序为
; 0 = 默认 | 1 = A | 2 = B | 3 = C | 4 = D | 5 = E | 6 = F | 7 = G
; 8 = H | 9 = I | 10 = J | 11 = K | 12 = L | 13 = M | 14 = N | 15 = O 
; 默认（auto）为 0
RenderPresetForAll=auto
RenderPresetDLAA=auto
RenderPresetUltraQuality=auto
RenderPresetQuality=auto
RenderPresetBalanced=auto
RenderPresetPerformance=auto
RenderPresetUltraPerformance=auto

; 对 NGX 使用通用 appid，修复 OptiScaler 预设覆盖在部分游戏中失效的问题
; true 或 false - 默认（auto）为 false
UseGenericAppIdWithDlss=auto



; -------------------------------------------------------
[DLSSD]
; -------------------------------------------------------
; 设为 true 以启用自定义渲染预设覆盖
; true 或 false - 默认（auto）为 false
RenderPresetOverride=auto

; 画质设置的渲染预设
; 取决于 DLSSD 版本，但最新的顺序为
; 0 = 默认 | 1 = A | 2 = B | 3 = C | 4 = D | 5 = E
; 默认（auto）为 0
RenderPresetForAll=auto
RenderPresetDLAA=auto
RenderPresetUltraQuality=auto
RenderPresetQuality=auto
RenderPresetBalanced=auto
RenderPresetPerformance=auto
RenderPresetUltraPerformance=auto



; -------------------------------------------------------
[NvngxFG]
; -------------------------------------------------------
; 修复 Windows 下 AMD 显卡在部分游戏（多为非 UE）中的画面异常
; 可能导致卡顿，建议仅在必要时且说明中有所提及的情况下使用
; true 或 false - 默认（auto）为 false
MakeDepthCopy=auto

; 接受任意标志组合，例如 0x14100000
; For reference https://github.com/artur-graniszewski/dlss-enabler-main/blob/a92464d468eb0d91ae17befa66c6bf6229f20b9f/Utils/DlssgProxy.cpp#L1033
; 任意标志组合 - 默认（auto）为 0x10000000（IGNORE_UI_TEXTURE）
DispatchFlags = auto

; 控制设置给 DLSSG.ShowDebug 的值
; 似乎只显示插值帧
; true 或 false - 默认（auto）为 false
ShowDebug = auto

; 禁止将无 HUD 资源发送给 DLSSG
; 某些 DispatchFlags 组合可能需要，参见参考资料
; true 或 false - 默认（auto）为 false
DisableHudless = auto



; -------------------------------------------------------
[Libraries]
; -------------------------------------------------------
; OptiScaler 查找下级 dll 文件的主目录
; 默认为 .\OptiScaler
OptiDllPath=auto

; 以下选项用于按 dll 覆盖路径
; -----------------------------------------

; nvngx.dll 或 _nvngx.dll
NvngxPath=auto

; nvngx_dlss.dll（DLSS 核心库）
NvngxDlssPath=auto

; nvapi64.dll 或 fakenvapi.dll
NvapiPath=auto
                     
; amd_fidelityfx_dx12.dll 或 amd_fidelityfx_loader_dx12.dll（FSR 主库 / 加载器）
FfxDx12Path=auto

; amd_fidelityfx_upscaler_dx12.dll（FSR 超分）
FfxDx12SRPath=auto

; amd_fidelityfx_framegeneration_dx12.dll（FSR 帧生成）
FfxDx12FGPath=auto

; amd_fidelityfx_denoiser_dx12.dll（FSR 光线重建降噪器）
FfxDx12RRPath=auto

; amd_fidelityfx_radiancecache_dx12.dll（FSR 辐射缓存）
FfxDx12RCPath=auto

; amd_fidelityfx_vk.dll（FSR Vulkan 版）
FfxVkPath=auto

; libxess.dll（XeSS 超分核心库）
XeSSPath=auto

; libxess_fg.dll（XeSS 帧生成库）
XeFGPath=auto

; libxell.dll（XeLL 低延迟库）
XeLLPath=auto

; libxess_dx11.dll（XeSS DX11 版）
XeSSDx11Path=auto

; 初始化期间会将此路径加入 Nvngx 的搜索路径
NvngxFeaturePath=auto



; -------------------------------------------------------
[Menu]
; -------------------------------------------------------
; 启用新的 Overlay ImGui 菜单
; 若不启用此选项，OptiScaler 将禁用所有 FG 功能
; true 或 false - 默认（auto）为 when OptiScaler is nvngx.dll false otherwise true
OverlayMenu=auto

; 游戏内 ImGui 菜单缩放
; 0.5 至 2.0 - 默认（auto）为 1.0, gets lower below 900p
Scale=auto

; 打开菜单的快捷键
; 所有按键代码的取值可查询以下地址
; 使描述与键值保持一致
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数值 - 默认（auto）为 0x2D，即 VK_INSERT/Insert 键；此前的默认按键为 0x24 -> VK_HOME/Home 键
; 例如要使用 VK_BACK/Backspace 键，其值为 0x08 - 设置 ShortcutKey=0x08
; -1 -> 不设置快捷键
ShortcutKey=auto

; 将缩放比例限制扩展到 0.1 - 6.0
; true 或 false - 默认（auto）为 false
ExtendedLimits=auto

; 为菜单使用高质量字体
; 可能占用更多显存
; 如果在 Vulkan 下出现黑屏叠加或与菜单相关的崩溃，请尝试禁用
; true 或 false - 默认（auto）为 true
UseHQFont=auto

; 仅调整字体大小，不影响其他样式元素
; 主要用于通过 TTFFontPath 使用自定义字体的情况
; float - 默认（auto）为 14.0
FontSize=auto

; 用作高质量字体的字体路径，需要 UseHQFont=true
; 建议使用等宽字体
; 路径示例：C:\Windows\Fonts\comic.ttf
; 默认（auto）为 Hack-Regular bundled with OptiScaler
TTFFontPath=auto

; 禁用启动闪屏提示
; true 或 false - 默认（auto）为 false
DisableSplash=auto

; 启用 FPS 叠加显示
; true 或 false - 默认（auto）为 false
ShowFps=auto

; 游戏内 FPS 叠加层缩放
; 0.5 至 2.0 - 默认（auto）为 using the same scale as menu
FpsScale=auto

; FPS 叠加层位置
; 0 = 左上 | 1 = 右上 | 2 = 左下 | 3 = 右下
; 0 至 3 - 默认（auto）为 0
FpsOverlayPos=auto

; FPS 叠加层类型
; 0 = 仅 FPS | 1 = 简洁 | 2 = 详细 | 3 = 详细 + 曲线 | 4 = 完整 | 5 = 完整 + 曲线 | 6 = Reflex 计时
; 0 至 6 - 默认（auto）为 0
FpsOverlayType=auto

; FPS 叠加层的快捷键
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数值 - 默认（auto）为 0x21 -> VK_PRIOR/Page up 键
; -1 -> 不设置快捷键
FpsShortcutKey=auto

; 切换 FPS 叠加层类型的快捷键
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数值 - 默认（auto）为 0x22 -> VK_NEXT/Page down 键
; -1 -> 不设置快捷键
FpsCycleShortcutKey=auto

; 启用横向 FPS 叠加布局
; true 或 false - 默认（auto）为 false
FpsOverlayHorizontal=auto

; FPS 叠加层背景透明度
; 0.0 至 1.0 - 默认（auto）为 0.4
FpsOverlayAlpha=auto

; 启用/禁用 FG 的快捷键
; https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
; 整数值 - 默认（auto）为 0x23 -> VK_END/End 键
; -1 -> 不设置快捷键
FGShortcutKey=auto

; 叠加层使用主题配色
; true 或 false - 默认（auto）为 false
OverlaysUseTheme=auto

; 为菜单启用浅色主题
; true 或 false - 默认（auto）为 false
LightTheme=auto

; 菜单的强调色
; 菜单强调色的 R/G/B 浮点颜色值
; 0.0 至 1.0 - 默认（auto）R: 0.0, G: 0.4, B: 0.77（蓝色）
AccentColorR=auto
AccentColorG=auto
AccentColorB=auto

; 菜单背景颜色
; 菜单强调色的 R/G/B 浮点颜色值
; 0.0 至 1.0 - 默认（auto）R: 0.0, G: 0.0, B: 0.0（黑色）
BGColorR=auto
BGColorG=auto
BGColorB=auto

; 菜单背景透明度
; 0 为透明，1 为不透明
; 0.0 至 1.0 - 默认（auto）0.99
BGColorA=auto




; -------------------------------------------------------
[Spoofing]
; -------------------------------------------------------
; 要伪装的 VendorID
; 0x10de = Nvidia | 0x8086 = Intel | 0x1002 = AMD
; 整数值 - 默认（auto）为 0x10de
SpoofedVendorId=auto

; 要伪装的 DeviceID
; 0x2684 = 4090 | 0xE20B = B580 | 0x7550 9070 XT
; 整数值 - 默认（auto）为 0x2684（4090）
SpoofedDeviceId=auto

; 要伪装的目标 VendorID
; 整数值 - 默认（auto）为全部
TargetVendorId=auto

; 要伪装的目标 DeviceID
; 默认（auto）为 all
TargetDeviceId=auto

; 伪装的 GPU 名称
; NVIDIA GeForce RTX 4090 | Intel(R) Arc(TM) B580 Graphics | AMD Radeon RX 9070 XT
; 默认（auto）为 NVIDIA GeForce RTX 4090
SpoofedGPUName=auto

; 为 Streamline 启用 GPU 伪装，即使游戏其余部分已禁用 Dxgi 伪装
; 通常允许在不伪装整个游戏的情况下使用 Fakenvapi，有时也适用于 DLSS/DLSSG
; true 或 false - 默认（auto）为 true
StreamlineSpoofing=auto

; 为 DXGI 启用 Nvidia GPU 伪装（可在上方修改为伪装其他厂商）
; true 或 false - 默认（auto）为 true for AMD/Intel, false for Nvidia
Dxgi=auto

; 启用对 DxgiFactory 的包装而非挂钩
; 可能导致问题，也可能帮助 Nvidia 显卡配合其他 MOD
; true 或 false - 默认（auto）为 false
DxgiFactoryWrapping=auto

; 当调用方方法在列表中时跳过 DXGI GPU 伪装（例如：slInit|slGetPluginFunction|nvapi_QueryInterface）
; 注意：这会禁用后续所有调用的伪装，并且在 Linux 上无效
; 方法名以竖线 "|" 分隔 - 默认（auto）为禁用
DxgiBlacklist=auto

; 为 DXGI 伪装显存容量
; 伪装的容量（GB） - 默认（auto）为禁用
DxgiVRAM=auto

; 为 Vulkan 启用 Nvidia GPU 伪装（可在上方修改为伪装其他厂商）
; true 或 false - 默认（auto）为 false
Vulkan=auto

; 为 Vulkan 启用 Nvidia 扩展伪装
; true 或 false - 默认（auto）为 false
VulkanExtensionSpoofing=auto

; 为 Vulkan 伪装显存容量
; 伪装的容量（GB） - 默认（auto）为禁用
VulkanVRAM=auto

; 启用对硬件加速 GPU 调度（HAGS）的伪装
; Nukem MOD 所需，同时让 RTX40xx 系列用户在不启用 HAGS 的情况下使用 DLSSG
; true 或 false - 默认（auto）为 false, unless DLSSG mod is enabled
SpoofHAGS=auto

; 启用对请求的 D3D 特性级别的覆盖
; true 或 false - 默认（auto）为 false
D3DFeatureLevel=auto

; 防止 UE 游戏出现"不支持 DirectX12"的错误
; 在启用伪装时对 Intel 显卡
; true 或 false - 默认（auto）为 false
UEIntelAtomics=auto

; 在注册表层面伪装厂商 ID、设备 ID 和驱动版本
; true 或 false - 默认（auto）为 false
Registry=auto

; 在注册表中伪装的驱动版本
; 字符串值 - 默认（auto）为 32.0.15.9155（适用于 Nvidia）
RegistryDriver=auto

; 在 User32 层面伪装厂商 ID、设备 ID
; true 或 false - 默认（auto）为 false
User32=auto



; -------------------------------------------------------
[Plugins]
; -------------------------------------------------------
; 用于查找同名插件（dxgi.dll、winmm.dll 等）的路径
; 默认位于 OptiDllPath 下的 plugins 目录 ".\OptiScaler\plugins\"
Path=auto

; 允许 OptiScaler 加载 plugins 目录中的 *.asi 文件
; true 或 false - 默认（auto）为 false
LoadAsiPlugins=auto

; plugins 目录中延迟加载的 *.asi 文件的注入延迟
; 要延迟加载 ASI 插件，请在其文件名的扩展名前加上 -loadlate，例如 "myplugin-loadlate.asi"
; 以秒为单位的整数值 - 默认（auto）为 30
LateAsiPluginsDelay=auto

; 从游戏 exe 所在目录加载 SpecialK64.dll
; 请在 SpecialK64.dll 旁创建一个空的 SpecialK.dxgi 文件
; 用于设置 SpecialK 的工作模式，否则它不会被激活
; 由于稳定性问题，当启用 OPTIFG、通过 SL 的 DLSSG 或 FSR-FG 输入时不会加载
; true 或 false - 默认（auto）为 false
LoadSpecialK=auto

; 从游戏 exe 所在目录加载 Reshade64.dll
; 将 Reshade dll 重命名为 ReShade64.dll 并放到 OptiScaler 旁边，然后设为 true
; true 或 false - 默认（auto）为 false
LoadReshade=auto

; 为所有检测到的 RDNA 2 显卡加载自定义 amdxc64.dll
; OptiScaler 从 OptiDllPath 加载，例如 ".\OptiScaler\amdxc64.dll"
; true 或 false - 默认（auto）为 false
LoadCustomAmdxc64OnRdna2=auto

; -------------------------------------------------------
[fakenvapi]
; -------------------------------------------------------
; 当缺少 nvapi64.dll 时使用 fakenvapi。
; fakenvapi 替换 nvapi 调用，使 AntiLag 2 或 XeLL 等功能可以替代 Reflex
; 有时也是 DLSS/DLSSG 能够显示出来的必要条件
; true 或 false - 默认（auto）为 true
UseFakenvapi=auto

; 允许 XeLL 在非 Intel 显卡上无需 FG 也能工作，需要更新版的 libxell + libxess_fg
; 禁用 FG 相关选项
; true 或 false - 默认（auto）为 false
ForceXeLL=auto

; 即使有更好的可用选项，也尝试使用 LatencyFlex
; 使用 XeFG 时无效
; true 或 false - 默认（auto）为 false
ForceLatencyFlex=auto

; 控制 latencyflex 的工作方式
; 0 = 保守
; 1 = 激进，可改善延迟，但某些情况下帧数下降幅度会超出预期
; 2 = 使用 Reflex 帧 ID，部分游戏不兼容（如《赛博朋克》），将回退为激进模式
; 默认（auto）为 0
LatencyFlexMode=auto

; 强制 Reflex 状态，适用于仅在使用 DLSSG 时才启用 Reflex、而没有独立 Reflex 开关的游戏
; 0 - 跟随游戏内设置，1 - 强制禁用，2 - 强制启用
; 默认（auto）为 0
ForceReflex=auto



; -------------------------------------------------------
[NvApi]
; -------------------------------------------------------
; 禁用 FlipMetering
; 修复使用 NukemFG 时由 Nvidia Flip Metering 导致的帧时间曲线过粗问题，需要 Fakenvapi 才能生效
; true 或 false - 默认（auto）为 false for Nvidia, true for others
DisableFlipMetering=auto



; -------------------------------------------------------
[Dx11withDx12]
; -------------------------------------------------------
; 创建 D11wDx12 特性时延迟部分操作以提高兼容性
; true 或 false - 默认（auto）为 false
UseDelayedInit=auto

; 优先使用层级更低的 D3D11_RESOURCE_MISC_SHARED
; 性能稍好，但兼容性可能较差
; true 或 false - 默认（auto）为 true
DontUseNTShared=auto



; -------------------------------------------------------
[Hooks]
; -------------------------------------------------------
; 提前挂钩内核方法
; 可能导致兼容性问题！！！
; true 或 false - 默认（auto）为 false
EarlyHooking=auto

; 跳过对本地 nvngx 文件的挂钩，仅挂钩注册表中的 nvngx
; Uniscaler + FG 所需
; true 或 false - 默认（auto）为 false
HookOriginalNvngxOnly=auto

; 仅挂钩 ntdll.dll 的方法，跳过 kernel32.dll 和 kernelbase.dll 的挂钩
; true 或 false - 默认（auto）为 true
UseNtdllHooks=auto



; -------------------------------------------------------
[Sharpness]
; -------------------------------------------------------
; 可选值：
; RCAS - AMD 的稳健对比度自适应锐化
; DA - 启用基于深度的锐化边缘检测。
;      降低物体边缘处的锐化强度，以避免光晕和画面伪影。
;      物体距离越远，锐化强度越高（上限为 1.0）
;      推荐用于几何结构复杂或采用超分的场景。
; LCDA - 上述 DA 的局部对比度版本
; rcas、da 或 lcda - 默认（auto）为 rcas
Shader=auto

; 用固定的锐化值覆盖 DLSS 锐化参数
; true 或 false - 默认（auto）为 false
OverrideSharpness=auto

; 锐化强度，
; 取值范围 0.0 至 1.0（用到上限时为 RCAS 1.3） - 默认（auto）为 0.3
Sharpness=auto



; -------------------------------------------------------
[OutputScaling]
; -------------------------------------------------------
; 为 Dx12 及使用 Dx12 后端的 Dx11 启用输出缩放选项
; true 或 false - 默认（auto）为 false
Enabled=auto

; 输出缩放比例
; 0.5 - 3.0 - 默认（auto）为 1.5
Multiplier=auto

; 输出缩放所使用的降采样器
; 0 = FSR1 | 1 = Bicubic | 2 = Catmull-Rom | 3 = Lanczos2 | 4 = Lanczos3 | 5 = Kaiser2 | 6 = Kaiser3 | 7 = MAGIC
; 0 至 7 - 默认（auto）为 0 (FSR1)
Downscaler=auto



; -------------------------------------------------------
[CAS]
; -------------------------------------------------------
; 启用 RCAS 锐化
; true 或 false - 默认（auto）为 false
Enabled=auto

; 启用运动锐化
; true 或 false - 默认（auto）为 false
MotionSharpnessEnabled=auto

; 将根据运动长度增加或减少锐化
; 取值范围 -1.3 至 1.3 - 默认（auto）为 0.4
MotionSharpness=auto

; 应用运动锐化前像素需要移动的距离
; 0.0 - 100.0 - 默认（auto）为 0.0
MotionThreshold=auto

; 像素移动多少距离可达到 MotionSharpness 最大值
; 介于 MotionThreshold 与此值之间的数值将用于缩放锐化强度
; 0.0 - 100.0 - 默认（auto）为 10.0
MotionScaleLimit=auto

; 启用基于对比度的锐化
; 增强高对比度区域的锐化。
; true 或 false - 默认（auto）为 false
ContrastEnabled=auto

; 基于对比度的锐化强度
; 数值越高，高对比度区域的锐化越强。
; 高数值与高锐化同时使用时可能导致画面出现异常（BUG）！！！
; 0.0 - 2.0 - 默认（auto）为 0.0
Contrast=auto

; 为运动/DA 锐化启用调试高亮
; 加锐时偏红，减锐时偏绿
; 深度感知锐化中检测到的边缘的蓝色着色量
; true 或 false - 默认（auto）为 false
SharpenerDebug=auto

; 控制沿深度边缘降低锐化的强度。
; 数值越高，越会积极地在物体边缘阻止锐化（可减少光晕）。
; 数值越低，允许在边缘处进行更多锐化（更锐利，但风险更高）。
; 2.0 - 600.0 - 默认（auto）为 4.0
DADepthScale=auto

; 在边缘检测前忽略细小的深度差异。
; 数值越高，越能减少微小深度变化引起的噪点和闪烁。
; 数值越低越能保留精细细节，但可能对深度噪点敏感。
; 0.005 - 0.03 - 默认（auto）为 0.01
DADepthBias=auto

; 将最终图像钳制到 [0, 1] 范围内。
; 防止亮色光晕或负色等过冲伪影。
; 推荐用于 LDR 管线；HDR 下是否启用取决于色调映射。
; true 或 false - 默认（auto）为 false
DAClampOutput=auto



; -------------------------------------------------------
[Magnifier]
; -------------------------------------------------------
; 启用放大镜
; 默认仅在菜单可见时显示，并跟随光标
; true 或 false - 默认（auto）为 false
Enabled=auto

; 放大镜半径，以屏幕高度的百分比表示
; float - 默认（auto）为 15.0
Size=auto

; 放大镜的缩放倍率
; 2 - 20 - 默认（auto）为 4
ZoomFactor=auto

; 放大镜黑边宽度，以屏幕高度的百分比表示
; 0.0 - 2.0 - 默认（auto）为 0.3
BorderSize=auto

; 放大镜相对于鼠标位置的偏移，单位为像素
; -1000 - 1000 - 默认（auto）为 0
CursorOffsetX=auto
CursorOffsetY=auto

; 放大镜的静态位置，以屏幕的百分比表示
; 同时设置这两个值会将放大镜切换为静态模式
; 在静态模式下，即使菜单未打开，放大镜也始终可见
; 0 - 100 - 默认（auto）为 none
StaticPosX=auto
StaticPosY=auto



; -------------------------------------------------------
[Log]
; -------------------------------------------------------
; 是否创建日志文件
; true 或 false - 默认（auto）为 false
LogToFile=auto

; 文件日志的详细级别
; 0 = Trace / 1 = Debug / 2 = Info / 3 = Warning / 4 = Error
; 默认（auto）为 0 = Trace
LogLevel=auto

; 输出日志到控制台（出于性能考虑，日志级别始终为 2（Info））
; true 或 false - 默认（auto）为 false
LogToConsole=auto

; 输出日志到 NVNGX API
; true 或 false - 默认（auto）为 false
LogToNGX=auto

; 输出日志到调试输出
; true 或 false - 默认（auto）为 false
LogToDebug=auto

; 为日志打开控制台窗口
; true 或 false - 默认（auto）为 false
OpenConsole=auto

; 设为 false 时，每次 OptiScaler 会话都会创建新的日志文件
; true 或 false - 默认（auto）为 true
SingleFile=auto

; 自定义日志文件名
; 也可以为日志指定自定义*路径*
; 默认（auto）为 OptiScaler.log in current folder
LogFileName=auto

; 启用异步日志
; true 或 false - 默认（auto）为 true
LogAsync=auto

; 异步日志线程
; 1 - 8 - 默认（auto）为 1
LogAsyncThreads=auto



; -------------------------------------------------------
[InitFlags]
; -------------------------------------------------------
; 强制在初始化标志中加入 ENABLE_AUTOEXPOSURE
; 部分虚幻引擎游戏需要此项，可修复颜色问题，尤其是暗部
; true 或 false - 默认（auto）为 DLSS value
AutoExposure=auto

; 强制在初始化标志中加入 HDR_INPUT_COLOR
; true 或 false - 默认（auto）为 DLSS value
HDR=auto

; 强制在初始化标志中加入 INVERTED_DEPTH
; true 或 false - 默认（auto）为 DLSS value
DepthInverted=auto

; 强制在初始化标志中加入 JITTERED_MV
; true 或 false - 默认（auto）为 DLSS value
JitterCancellation=auto

; 强制在初始化标志中加入 HIGH_RES_MV
; true 或 false - 默认（auto）为 DLSS value
DisplayResolution=auto

; 强制从初始化标志中移除 RESPONSIVE_PIXEL_MASK
; true 或 false - 默认（auto）为 true
DisableReactiveMask=auto



; -------------------------------------------------------
[UpscaleRatio]
; -------------------------------------------------------
; 设为 true 以启用内部分辨率覆盖
; true 或 false - 默认（auto）为 false
UpscaleRatioOverrideEnabled=auto

; 设置强制超分比例值
; 默认（auto）为 1.3
UpscaleRatioOverrideValue=auto



; -------------------------------------------------------
[QualityOverrides]
; -------------------------------------------------------
; 设为 true 以启用自定义画质模式覆盖
; true 或 false - 默认（auto）为 false
QualityRatioOverrideEnabled=auto

; 为每种画质模式设置自定义超分比例
;
; 默认（auto）值：
; DLAA					: 1.0
; 超级质量 : 1.3
; 质量 : 1.5
; 均衡 : 1.7
; 性能 : 2.0
; 超级性能 : 3.0
QualityRatioDLAA=auto
QualityRatioUltraQuality=auto
QualityRatioQuality=auto
QualityRatioBalanced=auto
QualityRatioPerformance=auto
QualityRatioUltraPerformance=auto



; -------------------------------------------------------
[DRS]
; -------------------------------------------------------
; 设为 true 以启用将 DRS 最小分辨率限制为渲染分辨率
; true 或 false - 默认（auto）为 false
DrsMinOverrideEnabled=auto

; 设为 true 以启用将 DRS 最大分辨率限制为渲染分辨率
; true 或 false - 默认（auto）为 false
DrsMaxOverrideEnabled=auto



; -------------------------------------------------------
[HDR]
; -------------------------------------------------------
; 强制使用 HDR 色彩空间
; true 或 false - 默认（auto）为 false
ForceHDR=auto

; 使用 HDR10
; 使用 DXGI_FORMAT_R10G10B10A2_UNORM 替代 DXGI_FORMAT_R16G16B16A16_FLOAT
; true 或 false - 默认（auto）为 false
UseHDR10=auto

; 跳过设置 HDR 色彩空间
; true 或 false - 默认（auto）为 false
SkipColorSpace=auto



; -------------------------------------------------------
[V-Sync]
; -------------------------------------------------------
; 启用垂直同步控制
; true 或 false - 默认（auto）为 false
OverrideVsync=auto

; 强制垂直同步取值
; true 或 false - 默认（auto）为 none selected
ForceVsync=auto

; 垂直同步的同步间隔值
; 0 至 3 - 默认（auto）为 none selected
SyncInterval=auto



; -------------------------------------------------------
[Anisotropy]
; -------------------------------------------------------
; 覆盖纹理的最大各向异性/各向异性过滤
; 2, 4, 8, 16 - 默认（auto）为禁用
AnisotropyOverride=auto

; 将比较采样过滤器改为各向异性
; true 或 false - 默认（auto）为 true
ModifyComparison=auto

; 将最小/最大过滤器改为各向异性
; true 或 false - 默认（auto）为 true
ModifyMinMax=auto

; 跳过对点采样过滤器的覆盖
; true 或 false - 默认（auto）为 true
SkipPointFilter=auto



; -------------------------------------------------------
[Mipmap]
; -------------------------------------------------------
; 覆盖 Mipmap LOD 偏置的值
; -15.0 - 15.0 - 默认（auto）为 disabled
MipmapBiasOverride=auto

; 为 LOD 偏置使用固定值
; true 或 false - 默认（auto）为 false
MipmapBiasFixedOverride=auto

; 将覆盖值用作缩放乘数
; true 或 false - 默认（auto）为 false
MipmapBiasScaleOverride=auto

; 覆盖所有纹理的 LOD 偏置（通常仅覆盖 < 0 的值）
; true 或 false - 默认（auto）为 false
MipmapBiasOverrideAll=auto



; -------------------------------------------------------
[ProcessFilter]
; -------------------------------------------------------
; 仅注入到此特定进程（不区分大小写）
; 示例：TargetProcessName=endfield.exe
; 默认（auto）为 disabled (injects into all processes)
TargetProcessName=auto

; 不注入到此特定进程（不区分大小写）
; 进程名以竖线 "|" 分隔 - 默认（auto）为
; crashpad_handler.exe 及其他 - 列于 Config.h 的 ProcessFilter 中
ProcessExclusionList=auto



; -------------------------------------------------------
[Hotfix]
; -------------------------------------------------------
; 启用从 Github 检查最新版本
; true 或 false - 默认（auto）为 true
CheckForUpdate=auto

; 启用对 Steam 和 Epic 叠加层的屏蔽
; 同时屏蔽 Steam Input
; true 或 false - 默认（auto）为 false, except for OptiFG when true
DisableOverlays=auto

; 使用手动输入轮询而非挂钩 WndProc
; 可能有助于解决无法正确捕获输入的游戏
; 缺点是菜单打开时将无法屏蔽输入
; true 或 false - 默认（auto）为 false
ManualInputPolling=auto

; 为 FG 交换链模拟可等待对象的事件信号
; true 或 false - 默认（auto）为 false
SimulateWaitableObject=auto

; OptiScaler 将延迟加载 Reshade，先创建 D3D12 设备
; 此选项可避免与 Luma 及部分其他 ReShade MOD 产生警告/崩溃
; 使用 Luma MOD 且此项启用时
; true 或 false - 默认（auto）为 false
CreateD3D12DeviceForLuma=auto

; OptiScaler 将尝试强制使用高性能 GPU
; true 或 false - 默认（auto）为 false
PreferDedicatedGpu=auto

; OptiScaler 仅报告第一个高性能 GPU
; true 或 false - 默认（auto）为 false
PreferFirstDedicatedGpu=auto

; 将内部渲染分辨率的宽高舍入为该值的整数倍
; 2, 4, 8, 16 ... - 默认（auto）为禁用
RoundInternalResolution=auto

; 跳过 n 帧的超分
; n 为整数 - 默认（auto）为禁用
SkipFirstFrames=auto

; 超分后恢复上次使用的计算签名
; true 或 false - 默认（auto）为 false
RestoreComputeSignature=auto

; 超分后恢复上次使用的图形签名
; true 或 false - 默认（auto）为 false
RestoreGraphicSignature=auto

; 尝试跟踪签名变化以完整恢复它们
; 对使用 bindless 的游戏有用
; true 或 false - 默认（auto）为 false
ExtendedStateRestore=auto

; 为 RCAS、输出缩放和遮罩偏置使用预编译着色器
; true 或 false - 默认（auto）为 true
UsePrecompiledShaders=auto

; 用于修复 AMD 显卡上彩虹色问题的颜色纹理资源状态（多见于 UE 游戏）
; AMD 平台上的 UE 引擎游戏请将 Color 设为 4（D3D12_RESOURCE_STATE_RENDER_TARGET）
ColorResourceBarrier=auto
; AMD 平台上的 UE 引擎游戏请将 MotionVector 设为 8（D3D12_RESOURCE_STATE_UNORDERED_ACCESS）
MotionVectorResourceBarrier=auto
DepthResourceBarrier=auto
ColorMaskResourceBarrier=auto
ExposureResourceBarrier=auto
OutputResourceBarrier=auto

; 默认（auto）为 state correction disabled
; 这些设置定义各资源的初始资源状态
; 状态，并添加资源屏障以确保状态正确
;
; 常用资源屏障状态
; ----------------------------------------------------
; D3D12_RESOURCE_STATE_COMMON = 0,
; D3D12_RESOURCE_STATE_VERTEX_AND_CONSTANT_BUFFER = 1,
; D3D12_RESOURCE_STATE_INDEX_BUFFER	= 2,
; D3D12_RESOURCE_STATE_RENDER_TARGET = 4,
; D3D12_RESOURCE_STATE_UNORDERED_ACCESS	= 8,
; D3D12_RESOURCE_STATE_DEPTH_WRITE = 16,
; D3D12_RESOURCE_STATE_DEPTH_READ = 32,
; D3D12_RESOURCE_STATE_NON_PIXEL_SHADER_RESOURCE = 64,
; D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE = 128,
;------------------------------------------------------
; 
; 所有状态值均可在此处查看
; https://learn.microsoft.com/en-us/windows/win32/api/d3d12/ne-d3d12-d3d12_resource_states
